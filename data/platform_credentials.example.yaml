# 受限平台取数凭证模板（复制为本地环境变量 / GitHub Secrets，切勿提交真实值）
# 与 news_pipeline/platform_access.py 对应；改完无需改代码。

# ---- 通路 A：开源聚合自建（推荐先试，0 元）-----------------------
# 在能直连上游的机器 / Vercel / Cloudflare 上自建：
#   git clone https://github.com/imsyy/DailyHotApi && docker compose up -d
#   git clone https://github.com/newsnext/newsnow   （MCP: npx -y newsnow-mcp-server）
#   git clone https://github.com/DIYgod/RSSHub
# 自带 /weibo /douyin /zhihu /baidu /toutiao /bilibili /kuaishou /tieba 等路由。
# 注意：DailyHotApi 没有小红书、微信搜一搜的上游路由，这两个必须走 C 或 B。
DAILYHOT_BASE_URL: ""          # 例 https://hot.your-domain.com
NEWSNOW_BASE_URL: ""           # 例 https://news.your-domain.com
RSSHUB_BASE_URL: ""            # 例 https://rss.your-domain.com

# ---- 通路 B：官方开放平台（企业资质，非全网热榜）-----------------
DOUYIN_CLIENT_KEY: ""
DOUYIN_CLIENT_SECRET: ""       # open.douyin.com，能力逐项申请，审核 5–7 工作日
XHS_APP_ID: ""
XHS_APP_SECRET: ""             # 小红书开放平台笔记详情 v4（需 note_id）
WECHAT_APPID: ""
WECHAT_SECRET: ""              # 搜一搜开放平台只做内容接入 / 品牌展示，无查询 API

# ---- 通路 C：已授权第三方聚合（免费试用额度，按次计费）-----------
# GitHub Secrets 里填 HOT_API_PROVIDER / HOT_API_KEY / HOT_API_BASE_URL 三件套即可。
# 代码已内置 dataxapi 热榜与 tikhub 微信搜一搜的真实调用格式，不需要自己改代码。
HOT_API_PROVIDER: ""           # dataxapi（抖音/小红书热榜）| tikhub（微信搜一搜）
HOT_API_KEY: ""                # 服务方控制台复制；DataXAPI 形如 dx_...，TikHub 为 Bearer token
HOT_API_BASE_URL: ""           # dataxapi=https://api.dataxapi.com ；tikhub=https://api.tikhub.io
HOT_API_KEYWORDS: ""           # 可选：微信搜一搜关键词，逗号分隔；默认 医保社保,裁员,房地产,新能源,地方债
HOT_API_STYLE: ""              # 可选：dailyhot | newsnow；留空则自动双格式探测自建实例

# ---- Step3：Jina Reader 免费正文补采（默认已开，无需 key）--------
# 无 key 20 RPM；注册后 10M tokens 且 500 RPM。填 GitHub Secrets 即自动使用。
JINA_API_KEY: ""               # jina.ai/api-dashboard/key-manager，形如 jina_...

# ---- Step1：词条 → 独立原文回查（收益最大）-----------------------
SERPER_API_KEY: ""             # serper.dev → Dashboard → API Keys（2,500 次一次性）
TAVILY_API_KEY: ""             # app.tavily.com → Dashboard（1,000 credits/月），可选备选

# ---- 通路 D：自持 Cookie + 外部签名服务（维护成本最高）-----------
DOUYIN_COOKIE: ""
XHS_COOKIE: ""
XHS_XSEC_TOKEN: ""
PROXY_URL: ""                  # 国内住宅代理；数据中心 IP 会被 byted_acrawler 默认拦
# 签名执行器（独立部署，不在本流水线进程内）：
#   抖音：Johnserf-Seed/f2 的 ABogusManager（a_bogus）/ XBogusManager，curl_cffi 做 Chrome TLS 伪装
#   小红书：xhs + playwright + stealth.min.js 生成 x-s / x-t / x-s-common；或 MediaCrawler
#   产出统一 clue JSON 后调用 platform_access.inject_clues() 注入

# ---- 词条 → 独立原文回查（所有通路共用，01 §3.3 强制）------------
SERPER_API_KEY: ""
TAVILY_API_KEY: ""
# 无上面两个 key 时走 reach.bing_backlink 站内回查；回查不到进附录 15，不进主表
